# beat_mashup.cfg
# ================
# Configuration for beat_mashup.py (DaVinci Resolve script).
# Place this file in the same folder as beat_mashup.py.
# All lines starting with # or ; are comments.
# Any key you leave out (or comment out) falls back to the built-in default.
# After editing, just re-run the script from Workspace > Scripts — no restart needed.

[beat_mashup]

# --------------------------------------------------------------------------
# Tempo
# --------------------------------------------------------------------------

# BPM of the song.
# 0 = detect automatically from the audio in the Media Pool.
# If the detector gets half or double the real tempo, type the correct value.
bpm = 0

# Seconds from the start of the audio file to the very first beat.
# -1 = detect automatically.
first_beat = -1

# Which beat of the detected grid is actually beat 1 of the bar (0–3).
# -1 = detect automatically.
# If long cuts feel one or two beats off, try 1, 2, or 3.
bar_shift = -1

# BPM search range used during auto-detection.
# Widen it only if your track is very slow (<70) or very fast (>180).
tempo_range = 70, 180

# --------------------------------------------------------------------------
# Cut length range
# --------------------------------------------------------------------------

# Minimum and maximum number of beats per video cut.
# Only 1, 2, and 4 are meaningful (they divide a 4/4 bar evenly).
# Both values are inclusive; every valid count in the range gets equal weight.
#
# Examples
#   min_beats = 1  max_beats = 4   →  1, 2, and 4-beat cuts (default – varied)
#   min_beats = 1  max_beats = 2   →  1- and 2-beat cuts only (fast cutting)
#   min_beats = 2  max_beats = 2   →  every cut is exactly 2 beats (uniform)
#   min_beats = 4  max_beats = 4   →  every cut is exactly one bar (slow)
min_beats = 1
max_beats = 4

# --------------------------------------------------------------------------
# Transient / hit snapping
# --------------------------------------------------------------------------

# When true, each beat-grid boundary is nudged to the nearest loud transient
# (snare, clap, kick hit, cymbal crash…) within a ±half-beat window.
# Requires audio analysis, so the song must be present in the Media Pool.
snap_to_hits = true

# Fraction of the loudest onset in the track (0–1).
# A boundary is only snapped when the strongest nearby hit is at least this
# fraction of the global peak.  Lower values snap more aggressively; higher
# values are more conservative (boundaries that fall in a quiet passage stay
# on the beat grid).
#
#   0.0  →  snap every boundary regardless of how quiet the passage is
#   0.25 →  snap unless the area is very quiet  (light touch)
#   0.35 →  default – only snap where hits are clearly present
#   0.60 →  only snap on the loudest hits in the track
#   1.0  →  never snap anything (same as snap_to_hits = false)
hit_threshold = 0.35

# --------------------------------------------------------------------------
# Timeline
# --------------------------------------------------------------------------

# Name of the timeline the script creates (or regenerates).
# Use a different name to keep several versions at once.
timeline_name = Beat mashup

# Total length of the edit in seconds.
# 0 = length of the song (or 60 s if there is no song).
duration = 0

# How often to place a blue bar-marker on the timeline (0 = none).
markers_every_bars = 4

# --------------------------------------------------------------------------
# Randomness
# --------------------------------------------------------------------------

# Random seed.  Leave empty for a different edit every run.
# The seed used is printed to the Console and stored in the cream marker —
# copy it here to reproduce an exact edit.
seed =

# --------------------------------------------------------------------------
# Clips
# --------------------------------------------------------------------------

# Try not to reuse the same stretch of a video clip.
avoid_reuse = true

# Also look in subfolders of the current Media Pool bin.
include_subfolders = false

# Name of the audio clip to use as the song.
# Leave empty to use the first audio clip found.
audio_clip =

# --------------------------------------------------------------------------
# Analysis
# --------------------------------------------------------------------------

# Full path to ffmpeg if it is not on your system PATH.
# Required for MP3, FLAC, M4A/AAC, AIFF, OGG, OPUS, WMA, and other
# non-WAV formats.  WAV files do not need ffmpeg.
#
# Windows example:  ffmpeg = C:\tools\ffmpeg\bin\ffmpeg.exe
# macOS example:    ffmpeg = /opt/homebrew/bin/ffmpeg
ffmpeg =

# --------------------------------------------------------------------------
# UI
# --------------------------------------------------------------------------

# Show the options dialog before generating (only works in Resolve builds
# that expose the UIManager / Fusion scripting interface).
# Set to false to skip the dialog and use this file's values directly.
show_dialog = true
